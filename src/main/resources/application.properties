spring.application.name=Employee_Management
server.port=${PORT:8080}

# Database: an in-memory H2 database by default, so the app runs with no setup.
# For PostgreSQL set DB_URL, DB_USERNAME and DB_PASSWORD, for example
#   DB_URL=jdbc:postgresql://localhost:5432/employee_db
spring.datasource.url=${DB_URL:jdbc:h2:mem:employee_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# Load sample departments, roles, employees and the demo hr/viewer accounts when the database is empty.
app.seed-data=${SEED_DATA:true}

# Security. JWT_SECRET signs login tokens: set your own (32+ characters) anywhere other than your laptop.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:480}
# The first admin account, created when there are no users yet.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# CSV import upload limit
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# API docs: /swagger-ui.html and /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true

management.endpoints.web.exposure.include=health
